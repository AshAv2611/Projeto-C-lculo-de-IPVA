<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Cálculo de IPVA</title>

    <script src="../js/script.js" type="module" defer></script>
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>
    <div id="geral">
        <h3>Informe abaixo os dados do automóvel</h3>

        <form id="formulario">
            <label for="modelo">Qual o modelo do veículo?</label>
            <input type="text" name="modelo" id="modelo"><br>

            <label for="marca">Qual a marca?</label>
            <input type="text" name="marca" id="marca"><br>

            <label for="placa">Qual a placa?</label>
            <input type="text" name="placa" id="placa"><br>

            <label for="ano">Qual o ano de fabricação?</label>
            <input type="text" name="ano" id="ano"><br>

            <label for="valorMercado"> Qual o valor de mercado desse veículo?</label>
            <input type="text" name="valorMercado" id="valorMercado"><br>

            <br><label>Qual o tipo de combustível utilizado?</label><br>

            <input type="radio" name="tipoCombustivel" id="gasolina" value="gasolina">
            <label for="gasolina">Gasolina</label><br>

            <input type="radio" name="tipoCombustivel" id="etanol" value="etanol">
            <label for="etanol">Etanol</label><br>

            <input type="radio" name="tipoCombustivel" id="bicombustivel" value="bicombustivel">
            <label for="bicombustivel">Bicombustíveis</label><br>

            <input type="radio" name="tipoCombustivel" id="hibrido" value="hibrido">
            <label for="hibrido">Híbridos</label><br>

            <input type="radio" name="tipoCombustivel" id="eletrico" value="eletrico">
            <label for="eletrico">Elétricos</label><br>

            <br><button type="submit"> Enviar </button>

        </form>

        <div id="Interface">

        </div>
    </div>
</body>

</html>
