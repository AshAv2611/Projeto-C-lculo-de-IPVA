<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Cálculo de IPVA</title>
    
    <script src="../js/script.js" defer></script>
</head>
<body>
    <div id="geral">
        <h3>Informe abaixo os dados do automóvel</h3>

        <form id="formulario">
            <label for="modelo" >Qual o modelo do veículo?</label>
            <input type="text" name="modelo" id="modelo">

            <label for="marca" >Qual a marca?</label>
            <input type="text" name="marca" id="marca">

            <label for="placa" >Qual a placa?</label>
            <input type="text" name="placa" id="placa">

            <label for="ano" >Qual o ano de fabricação?</label>
            <input type="text" name="ano" id="ano">

            <label for="valorMercado" > Qual o valor de mercado desse veículo?</label>
            <input type="text" name="valorMercado" id="valorMercado">

            <label for="tipoCombustivel"> Qual o tipo de combustível ultizado?</label>
            <input type="text" name="tipoCombustivel" id="tipoCombustivel">

            <button type="submit"> Enviar </button>


        </form>

        <div id="Interface">

        </div>
    </div>
</body>
</html>
